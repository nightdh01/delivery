<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14213D">
<title>물표 관리 V11</title>
<style>
:root{--ink:#14213D;--bg:#EEF1F4;--ln:#CFD7E1;--a:#B26A00;--b:#1650B8;--c:#1B7A4B;--mu:#5A6678}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
#app{min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
header b{flex:1;font-size:18px}
.w{width:100%;max-width:640px;margin:0 auto;padding:10px 12px;display:grid;gap:8px;flex:1;align-content:start}
.box{width:100%;max-width:340px;margin:18vh auto 0;padding:20px;display:grid;gap:12px}
h1{margin:0;font-size:26px}
label{display:grid;gap:4px;font-size:14px;color:var(--mu);min-width:0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--ln);border-radius:8px;padding:10px}
button{font:inherit;min-height:44px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--ink);padding:0 14px}
.p{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.s{background:transparent}
header .s{color:#fff;border-color:#ffffff66;min-height:36px;padding:0 10px}
.bk{background:transparent;color:#fff;border:0;font-size:28px;padding:0 6px;min-height:36px}
.dg{color:#B3261E;border-color:#B3261E}
.bar{position:sticky;bottom:0;z-index:5;width:100%;max-width:640px;margin:auto auto 0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--ln)}
.bar .p{flex:1}
.cd{background:#fff;border:1px solid var(--ln);border-left:6px solid var(--ln);border-radius:8px;padding:10px 12px;display:grid;gap:2px;user-select:none;-webkit-user-select:none}
.cd.a{border-left-color:var(--a)}.cd.b{border-left-color:var(--b)}.cd.c{border-left-color:var(--c)}
.r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.route{font-size:14px;font-weight:400;color:var(--mu);white-space:nowrap}
.m{color:var(--mu);font-size:14px;display:flex;flex-wrap:wrap;gap:0 12px}
.info{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:8px 12px;font-size:14px;display:grid;gap:1px}
.info b{font-size:17px}
.info div{display:flex;flex-wrap:wrap;gap:0 12px}
.info i{font-style:normal;color:var(--mu);margin-right:4px}
.info a{color:var(--b)}
.bd{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px}
.bd.a{background:#FFF1D6;color:var(--a)}.bd.b{background:#E1EBFF;color:var(--b)}.bd.c{background:#DDF3E7;color:var(--c)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
#sts .ch{flex:1}
.ch{border-radius:99px;min-height:40px;padding:0 12px}
.ch.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ch.a.on{background:var(--a);border-color:var(--a)}.ch.b.on{background:var(--b);border-color:var(--b)}.ch.c.on{background:var(--c);border-color:var(--c)}
.row{display:flex;gap:8px}
.no{background:var(--ink);color:#fff;border-radius:6px;padding:0 7px;font-size:13px;font-weight:700;margin-right:6px}
.tm{display:flex;flex-wrap:wrap;gap:0 14px;font-size:14px}
.tm i{font-style:normal;color:var(--mu);margin-right:4px}
.ex{color:var(--b);background:#E1EBFF;font-weight:700;border-radius:6px;padding:1px 8px;justify-self:start}
.pager{display:flex;align-items:center;justify-content:center;gap:8px}
.pager select{width:auto}
.pager button{min-height:40px}
.pager button:disabled{opacity:.4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 label{gap:4px}
.ph{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sl{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden}
.sl img{width:100%;height:100%;object-fit:cover}
.sl.e{display:grid;place-items:center;min-height:0;padding:0;border:2px dashed var(--ln);font-size:24px;color:var(--mu);background:transparent}
.x{position:absolute;top:2px;right:2px;min-height:24px;width:24px;padding:0;border-radius:99px;background:#000a;color:#fff;border:0;font-size:12px}
.err{color:#B3261E;margin:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.on{opacity:1}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* V9 - 터미널 정보를 첫 줄에 별도 스타일로 표시하고 출발/도착은 기존 형태 유지 */
/* V10 - 배송 삭제 시 Storage에 올라간 사진 파일도 함께 삭제 */
/* V11 - 배송 삭제 시 해당 배송 폴더 안에 남은 파일까지 모두 삭제(폴더 자동 정리) */
const SB_URL='https://jowlhidhtcsllqvcxmcf.supabase.co',
SB_KEY='sb_publishable_PpNY5XJoOqhw_K0RzzoBWA_0ttqv80z',
EMAIL='dragondha@naver.com';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST=['수령예정','수령중','수령완료'],CL={수령예정:'a',수령중:'b',수령완료:'c'};
const PAGE=20; /* 한 화면에 보이는 배송 수 */
let MA=[],M=[],list=[],flt='전체',q='',view='',ch=null,PH={},pg=1;
const name=id=>MA.find(m=>m.id===id)?.name||'';
const opts=(sel,ph='선택 안 함')=>`<option value="">${ph}</option>`+M.map(m=>`<option value="${m.id}"${m.id===sel?' selected':''}>${esc(m.name)}</option>`).join('');
const fmt=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const loc=t=>{if(!t)return'';const d=new Date(t),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2600)};

/* 뒤로가기: 등록/상세/이름관리 화면에서 폰의 뒤로가기를 누르면 목록으로 돌아감 */
const sub=()=>history.pushState({v:'sub'},'');
const toHome=()=>history.state&&history.state.v==='sub'?history.back():home();
const back=()=>{const b=$('#bk');if(b)b.onclick=toHome};
addEventListener('popstate',()=>{if(view==='form'||view==='m')home()});

/* 카톡 안내문 자동 추출 */
function parse(t){
 const K={receipt_no:'접수번호',sender:'발송인',recipient:'수취인',item_name:'품목명',departure_terminal:'발송터미널',departure_date:'출발일자',departure_time:'출발시간',arrival_terminal:'도착터미널',arrival_time:'도착예정시간',arrival_contact:'도착문의',contact:'연락처',vehicle_no:'차량번호'};
 const o={};
 for(const[k,w]of Object.entries(K)){
  const re=new RegExp('^[\\s\\-•·*]*'+[...w].join('\\s*')+'\\s*[:：]?\\s*(.*)$','m');
  o[k]=(t.match(re)?.[1]||'').trim();
 }
 o.receipt_no=o.receipt_no.replace(/\D/g,'');
 const bus=o.departure_time.match(/\(([^)]*)\)/);o.bus_company=bus?bus[1].trim():'';
 const hm=s=>{const m=s.match(/(\d{1,2})\s*(?:시|:)\s*(\d{1,2})?/);return m?m[1].padStart(2,'0')+':'+(m[2]||'00').padStart(2,'0'):s};
 o.departure_time=hm(o.departure_time);o.arrival_time=hm(o.arrival_time);
 const dm=o.departure_date.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
 o.departure_date=dm?`${dm[1]}-${dm[2].padStart(2,'0')}-${dm[3].padStart(2,'0')}`:'';
 o.contact=o.contact.replace(/[^\d-]/g,'');
 return o;
}

/* 로그인 */
function login(msg=''){
 view='login';
 app.innerHTML=`<div class="box"><h1>물표 관리</h1><p class="m">사무실 비밀번호를 입력하세요.</p><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호"><button class="p" id="go">들어가기</button><p class="err">${msg}</p></div>`;
 const go=async()=>{const{error}=await sb.auth.signInWithPassword({email:EMAIL,password:$('#pw').value});error?login('비밀번호가 맞지 않습니다.'):start()};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function loadM(){
 const{data}=await sb.from('members').select('*').order('sort_order').order('created_at');
 MA=data||[];M=MA.filter(m=>m.active);
}
async function start(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 history.replaceState({v:'list'},'');
 await loadM();await home();
 if(!ch)ch=sb.channel('d').on('postgres_changes',{event:'*',schema:'public',table:'deliveries'},()=>{if(view==='list')load()}).subscribe();
}

/* 목록 */
async function home(){
 view='list';
 app.innerHTML=`<header><b>물표</b><button class="s" id="mm">이름관리</button></header>
<div class="w"><div id="warn" class="m"></div><button class="p" id="nw">＋ 배송 등록</button>
<input id="q" placeholder="접수번호, 이름 검색" value="${esc(q)}">
<div class="chips" id="fl">${['전체',...ST].map(s=>`<button class="ch${s===flt?' on':''}" data-s="${s}">${s}</button>`).join('')}</div>
<div id="cnt" class="m"></div><div id="ls" style="display:grid;gap:8px">불러오는 중…</div><div id="pgr" class="pager"></div><button class="s" id="bu">백업 받기 (CSV)</button></div>`;
 $('#mm').onclick=members;$('#nw').onclick=newForm;$('#bu').onclick=backup;
 $('#q').oninput=e=>{q=e.target.value;pg=1;draw()};
 $('#fl').onclick=e=>{const s=e.target.dataset.s;if(!s)return;flt=s;pg=1;[...$('#fl').children].forEach(b=>b.classList.toggle('on',b.dataset.s===s));draw()};
 $('#ls').onclick=e=>{const c=e.target.closest('.cd');if(c)openD(c.dataset.id)};
 $('#pgr').onclick=e=>{const p=e.target.dataset.p;if(p){pg=+p;draw();scrollTo(0,0)}};
 $('#pgr').onchange=e=>{if(e.target.id==='ps'){pg=+e.target.value;draw();scrollTo(0,0)}};
 await load();
}
async function load(){
 const{data,error}=await sb.from('deliveries').select('*,delivery_photos(count)').is('deleted_at',null).order('registered_at',{ascending:false}).limit(1000);
 if(error)return toast('불러오기 실패: '+error.message);
 list=data;if(view==='list')draw();
}
const md=x=>{if(!x)return'';const[,m,d]=x.split('-');return`${+m}/${+d}`};
const bus=x=>{x=String(x||'').trim();return x.length>4?x.slice(0,2):x};
function draw(){
 const ls=$('#ls');if(!ls)return;
 const k=q.trim().toLowerCase();
 const r=list.filter(d=>(flt==='전체'||d.status===flt)&&(!k||[d.receipt_no,d.recipient,d.sender,d.item_name,name(d.registered_by),name(d.expected_receiver),d.expected_other,name(d.received_by),d.received_other].join(' ').toLowerCase().includes(k)));
 const pages=Math.max(1,Math.ceil(r.length/PAGE));if(pg>pages)pg=pages;
 const cur=r.slice((pg-1)*PAGE,pg*PAGE);
 ls.innerHTML=cur.map(d=>{
  const rc=name(d.received_by)||d.received_other,ex=name(d.expected_receiver)||d.expected_other;
  return`<div class="cd ${CL[d.status]}" data-id="${d.id}"><div class="r1"><span><span class="no">${d.display_no}</span><b>${esc(d.receipt_no)}</b><span class="route"> [${esc(d.departure_terminal)} &gt; ${esc(d.arrival_terminal)}]</span></span><span class="bd ${CL[d.status]}">${d.status}</span></div>
<div class="tm">출발 ${md(d.departure_date)} ${esc(d.departure_time)}${d.bus_company?`(${esc(bus(d.bus_company))})`:''}　도착 ${esc(d.arrival_time)}</div>
<div class="m"><span>수취인 ${esc(d.recipient)}</span><span>등록 ${esc(name(d.registered_by))}</span><span>사진 ${d.delivery_photos?.[0]?.count||0}장</span></div>
${d.status==='수령완료'&&rc?`<div class="m"><span>수령자 ${esc(rc)}</span></div>`:ex?`<div class="ex">수령예정 ${esc(ex)} ${fmt(d.expected_at)}</div>`:''}</div>`;
 }).join('')||'<p class="m">표시할 배송이 없습니다.</p>';
 $('#cnt').textContent=r.length?`총 ${r.length}건`+(pages>1?` (${pg}/${pages}쪽)`:''):'';
 $('#pgr').innerHTML=pages>1?`<button data-p="${pg-1}"${pg<2?' disabled':''}>‹ 이전</button><select id="ps">${Array.from({length:pages},(_,i)=>`<option value="${i+1}"${i+1===pg?' selected':''}>${i+1} / ${pages}쪽</option>`).join('')}</select><button data-p="${pg+1}"${pg>=pages?' disabled':''}>다음 ›</button>`:'';
 const old=list.filter(d=>Date.now()-new Date(d.registered_at)>365*864e5).length;
 $('#warn').textContent=!M.length?'먼저 "이름관리"에서 사무소 사람들의 이름을 추가하세요.':old?`등록 후 1년이 지난 자료가 ${old}건 있습니다. 아래 백업 받기로 저장해 두세요.`:'';
}

/* 배송 등록: 카톡 안내문 + 등록자 + 기타사항만 */
function newForm(){
 view='form';sub();
 app.innerHTML=`<header><button class="bk" id="bk">‹</button><b>배송 등록</b></header>
<div class="w"><label>카톡 안내문 붙여넣기<textarea id="raw" rows="9" placeholder="[고속버스택배 접수안내] 전체를 붙여넣으세요."></textarea></label>
<div id="pv" class="m"></div>
<label>등록자<select id="rb">${opts('','이름 선택')}</select></label>
<label>기타사항<textarea id="nt" rows="2"></textarea></label></div>
<div class="bar"><button class="p" id="sv">저장</button></div>`;
 back();
 let parseCheckSeq=0;
 $('#raw').oninput=async e=>{
  const seq=++parseCheckSeq;
  const t=e.target.value,o=parse(t),pv=$('#pv');
  if(!t.trim()){pv.textContent='';return}
  if(!o.receipt_no){pv.textContent='접수번호를 찾지 못했습니다. 안내문 전체를 붙여넣었는지 확인하세요.';return}

  const base=`인식: 접수번호 ${o.receipt_no}, ${o.departure_terminal} → ${o.arrival_terminal}, 수취인 ${o.recipient}`;
  pv.textContent=base;

  const{data,error}=await sb.from('deliveries')
    .select('id')
    .eq('receipt_no',o.receipt_no)
    .is('deleted_at',null);

  // 붙여넣기 과정에서 여러 input 이벤트가 발생해도
  // 가장 최근 입력 결과만 화면에 반영합니다.
  if(seq!==parseCheckSeq)return;

  if(error){
    console.error('[중복 확인 실패]',error);
    return;
  }

  pv.textContent=base+(data?.length?' (이미 등록된 접수번호입니다)':'');
 };
 $('#sv').onclick=async()=>{
  const raw=$('#raw').value,o=parse(raw),rb=$('#rb').value;
  if(!o.receipt_no)return toast('접수번호를 찾지 못했습니다. 안내문을 다시 붙여넣어 주세요.');
  if(!rb)return toast('등록자 이름을 선택하세요.');
  for(const k in o)o[k]=o[k]||null;
  const btn=$('#sv');btn.disabled=true;
  const{data:dup}=await sb.from('deliveries').select('id').eq('receipt_no',o.receipt_no).is('deleted_at',null);
  if(dup?.length){btn.disabled=false;return toast('이미 등록된 접수번호입니다.')}
  const{error}=await sb.from('deliveries').insert({...o,raw_text:raw,registered_by:rb,updated_by:rb,note:$('#nt').value.trim()||null});
  if(error){btn.disabled=false;return toast(error.code==='23505'?'이미 등록된 접수번호입니다.':'저장 실패: '+error.message)}
  toast('등록했습니다.');toHome();
 };
}

/* 배송 상세 */
async function openD(id){
 const{data,error}=await sb.from('deliveries').select('*').eq('id',id).single();
 if(error)return toast(error.message);detail(data);
}
const rsel=(id,mid,oth)=>{const o=oth&&!mid;return`<select id="${id}">${opts(mid)}<option value="__o"${o?' selected':''}>직접 입력…</option></select><input id="${id}o" value="${esc(oth)}" placeholder="이름 입력" style="${o?'':'display:none'}">`};
const rv=id=>{const v=$('#'+id).value;return v==='__o'?[null,$('#'+id+'o').value.trim()||null]:[v||null,null]};
function detail(d){
 view='form';sub();
 const dt=x=>x?x.slice(5):'';
 app.innerHTML=`<header><button class="bk" id="bk">‹</button><b>배송 상세</b></header>
<div class="w"><div class="info"><b>${esc(d.receipt_no)}</b>
<div>${esc(d.departure_terminal)} → ${esc(d.arrival_terminal)}</div>
<div><span><i>발송인</i>${esc(d.sender)}</span><span><i>수취인</i>${esc(d.recipient)}</span><span><i>품목</i>${esc(d.item_name)}</span></div>
<div><span><i>출발</i>${dt(d.departure_date)} ${esc(d.departure_time)}${d.bus_company?` (${esc(d.bus_company)})`:''}</span><span><i>도착예정</i>${esc(d.arrival_time)}</span></div>
<div><span><i>문의</i>${esc(d.arrival_contact)}</span><span><i>연락처</i><a href="tel:${esc(d.contact)}">${esc(d.contact)}</a></span>${d.vehicle_no?`<span><i>차량</i>${esc(d.vehicle_no)}</span>`:''}</div>
<div class="m"><span>등록 ${esc(name(d.registered_by))} ${fmt(d.registered_at)}</span></div></div>
<div class="chips" id="sts">${ST.map(s=>`<button class="ch ${CL[s]}${d.status===s?' on':''}" data-s="${s}">${s}</button>`).join('')}</div>
<div class="g2"><label>수령예정자${rsel('eb',d.expected_receiver,d.expected_other)}</label><label>실제 수령자${rsel('rc',d.received_by,d.received_other)}</label></div>
<label>수령예정시간<input id="ea" type="datetime-local" value="${loc(d.expected_at)}"></label>
<label>기타사항<textarea id="nt" rows="2">${esc(d.note)}</textarea></label>
<div class="m" id="pt"></div><div id="ph" class="ph"></div><input type="file" id="fi" accept="image/*" multiple hidden></div>
<div class="bar"><button class="p" id="sv">저장</button><button class="s dg" id="dl">삭제</button></div>`;
 back();photos(d);
 ['eb','rc'].forEach(id=>$('#'+id).onchange=e=>{$('#'+id+'o').style.display=e.target.value==='__o'?'':'none'});
 $('#sts').onclick=async e=>{
  const s=e.target.dataset.s;if(!s)return;
  const at=s==='수령완료'?(d.received_at||new Date().toISOString()):null;
  const{error}=await sb.from('deliveries').update({status:s,received_at:at}).eq('id',d.id);
  if(error)return toast(error.message);
  d.status=s;d.received_at=at;
  [...$('#sts').children].forEach(b=>b.classList.toggle('on',b.dataset.s===s));toast('상태: '+s);
 };
 $('#sv').onclick=async()=>{
  const[eb,eo]=rv('eb'),[rc,ro]=rv('rc');
  const{error}=await sb.from('deliveries').update({expected_receiver:eb,expected_other:eo,expected_at:$('#ea').value?new Date($('#ea').value).toISOString():null,received_by:rc,received_other:ro,note:$('#nt').value.trim()||null}).eq('id',d.id);
  if(error)return toast('저장 실패: '+error.message);
  toast('저장했습니다.');toHome();

 $('#dl').onclick=async()=>{
  if(!confirm('이 배송을 삭제할까요?\n등록된 사진도 함께 삭제되며 복구할 수 없습니다.'))return;
  const btn=$('#dl');btn.disabled=true;
  const fail=m=>{btn.disabled=false;toast(m)};

  // 1) DB에 등록된 사진 목록
  const{data:ph,error:e1}=await sb.from('delivery_photos').select('id,file_path').eq('delivery_id',d.id);
  if(e1){console.error('[배송 삭제] 사진 목록 조회 실패',e1);return fail('사진 정보 확인 실패: '+e1.message)}
  const paths=ph.map(p=>p.file_path);

  // 2) 이 배송 폴더에 실제로 남아 있는 파일도 모두 확인 (DB에 없는 파일, 빈 폴더 표시 파일 포함)
  const{data:left,error:e2}=await sb.storage.from('photos').list(d.id,{limit:1000});
  if(e2){console.error('[배송 삭제] 폴더 조회 실패',e2);return fail('사진 폴더 확인 실패: '+e2.message)}
  (left||[]).forEach(f=>{const p=d.id+'/'+f.name;if(f.name&&!paths.includes(p))paths.push(p)});

  // 3) Storage 파일 삭제 (실패하면 배송은 삭제하지 않고 중단)
  let n=0;
  if(paths.length){
   const{data:rm,error:e3}=await sb.storage.from('photos').remove(paths);
   if(e3){console.error('[배송 삭제] Storage 삭제 실패',{paths,error:e3});return fail('사진 파일 삭제 실패: '+e3.message)}
   n=(rm||[]).length;
   if(n<paths.length)console.warn('[배송 삭제] 삭제되지 않은 파일이 있습니다',{paths,removed:rm});
  }

  // 4) 사진 DB 정보 삭제
  if(ph.length){
   const{error:e4}=await sb.from('delivery_photos').delete().eq('delivery_id',d.id);
   if(e4){console.error('[배송 삭제] 사진 DB 정보 삭제 실패',e4);return fail('사진 정보 삭제 실패: '+e4.message)}
  }

  // 5) 배송을 목록에서 삭제(숨김 처리)
  const{error}=await sb.from('deliveries').update({deleted_at:new Date().toISOString()}).eq('id',d.id);
  if(error)return fail(error.message);
  toast(n?`삭제했습니다. (사진 ${n}장 정리)`:'삭제했습니다.');toHome();
 };
}

/* 사진 5칸 (여러 장 한 번에 선택 가능) */
async function photos(d){
 const{data}=await sb.from('delivery_photos').select('*').eq('delivery_id',d.id);
 PH={};(data||[]).forEach(p=>PH[p.slot]=p);
 const ps=(data||[]).map(p=>p.file_path),U={};
 if(ps.length)((await sb.storage.from('photos').createSignedUrls(ps,3600)).data||[]).forEach(x=>U[x.path]=x.signedUrl);
 const el=$('#ph');if(!el)return;
 $('#pt').textContent=`사진 ${ps.length}/5 (빈 칸을 누르면 여러 장 선택 가능)`;
 el.innerHTML=[1,2,3,4,5].map(s=>{const p=PH[s];return p
  ?`<div class="sl"><img src="${U[p.file_path]||''}" data-z="1" alt="사진 ${s}"><button class="x" data-x="${s}">✕</button></div>`
  :`<button class="sl e" data-add="1">＋</button>`}).join('');
 el.onclick=async e=>{
  if(e.target.dataset.add)return $('#fi').click();
  if(e.target.dataset.z)return window.open(e.target.src);
  const s=e.target.dataset.x;
  if(!s)return;
  if(!confirm('이 사진을 삭제할까요?'))return;

  const path=PH[s].file_path;

  // V5: Storage 파일을 먼저 삭제하고, 성공한 경우에만 DB 정보를 삭제합니다.
  const {data:storageData,error:storageError} =
    await sb.storage.from('photos').remove([path]);

  if(storageError){
    console.error('[사진 삭제] Storage 삭제 실패', {
      path,
      error: storageError
    });
    return toast('사진 파일 삭제 실패: ' + storageError.message);
  }

  console.log('[사진 삭제] Storage 삭제 성공', {
    path,
    data: storageData
  });

  const {error:dbError} =
    await sb.from('delivery_photos').delete().eq('id',PH[s].id);

  if(dbError){
    console.error('[사진 삭제] DB 정보 삭제 실패', {
      id: PH[s].id,
      path,
      error: dbError
    });
    return toast('사진 정보 삭제 실패: ' + dbError.message);
  }

  toast('사진을 삭제했습니다.');
  photos(d);
 };
 $('#fi').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)upMany(d,fs)};
}
async function shrink(f){
 const im=await createImageBitmap(f,{imageOrientation:'from-image'});
 const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.78));
}
async function up1(d,s,f){
 const b=await shrink(f),path=`${d.id}/${s}-${Date.now()}.jpg`;
 let r=await sb.storage.from('photos').upload(path,b,{contentType:'image/jpeg'});if(r.error)throw r.error;
 r=await sb.from('delivery_photos').insert({delivery_id:d.id,slot:s,file_path:path});
 if(r.error){await sb.storage.from('photos').remove([path]);throw r.error}
}
async function upMany(d,fs){
 const free=[1,2,3,4,5].filter(s=>!PH[s]);
 if(!free.length)return toast('사진은 5장까지 올릴 수 있습니다.');
 const use=fs.slice(0,free.length);let ok=0,fail=0;
 toast(`사진 ${use.length}장 올리는 중…`);
 for(let i=0;i<use.length;i++){try{await up1(d,free[i],use[i]);ok++}catch(e){fail++}}
 toast(`${ok}장 올렸습니다.`+(fail?` ${fail}장 실패.`:'')+(fs.length>use.length?` ${fs.length-use.length}장은 5장 초과로 제외.`:''));
 photos(d);
}

/* 백업 (CSV, 엑셀에서 한글 정상 표시) */
async function backup(){
 const{data,error}=await sb.from('deliveries').select('*').is('deleted_at',null).order('registered_at');
 if(error)return toast(error.message);
 const F=[['receipt_no','접수번호'],['sender','발송인'],['recipient','수취인'],['item_name','품목명'],['departure_terminal','발송터미널'],['departure_date','출발일자'],['departure_time','출발시간'],['bus_company','버스회사'],['arrival_terminal','도착터미널'],['arrival_time','도착예정시간'],['arrival_contact','도착문의'],['contact','연락처'],['vehicle_no','차량번호']];
 const cols=[...F.map(f=>f[0]),'status','registered_at','received_at','note'];
 const head=[...F.map(f=>f[1]),'상태','등록시간','수령시간','기타사항','등록자','수령예정자','실제수령자'];
 const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=data.map(d=>[...cols.map(c=>d[c]),name(d.registered_by),name(d.expected_receiver)||d.expected_other,name(d.received_by)||d.received_other].map(cell).join(','));
 const blob=new Blob(['\ufeff'+[head.map(cell).join(','),...rows].join('\r\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='물표백업_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
