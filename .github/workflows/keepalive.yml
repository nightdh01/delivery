name: keepalive

# 이 파일은 두 가지 일을 합니다.
#  1) 매주 월·목에 Supabase에 접속해서 프로젝트가 자동 정지되지 않게 함
#  2) 저장소에 45일 이상 변경이 없으면 빈 커밋을 자동으로 하나 남겨서,
#     GitHub가 60일 비활성으로 이 예약 작업을 끄지 않게 함
# 파일 위치: .github/workflows/keepalive.yml

on:
  schedule:
    - cron: '0 3 * * 1,4'   # 매주 월·목 낮 12시(한국시간)
  workflow_dispatch:         # 수동 실행 버튼도 사용 가능

permissions:
  contents: write            # 빈 커밋을 남기기 위해 필요

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase 접속
        run: |
          curl -fsS "https://jowlhidhtcsllqvcxmcf.supabase.co/rest/v1/members?select=id&limit=1" \
            -H "apikey: sb_publishable_PpNY5XJoOqhw_K0RzzoBWA_0ttqv80z"

      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 45일 이상 변경이 없으면 빈 커밋 남기기
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "마지막 커밋 이후 ${days}일"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (예약 작업 유지용 빈 커밋)"
            git push
            echo "빈 커밋을 남겼습니다."
          else
            echo "커밋이 필요하지 않습니다."
          fi
